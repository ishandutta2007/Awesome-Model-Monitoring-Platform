<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      @keyframes driftWave {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-30px); }
        100% { transform: translateX(0px); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 5; opacity: 0.6; }
        50% { r: 8; opacity: 1; }
      }
      .bg-glow {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .wave-line {
        animation: driftWave 8s ease-in-out infinite;
      }
      .pulse-node {
        animation: nodePulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16" />

  <!-- Dynamic Ambient Glow Objects in Background -->
  <circle class="bg-glow" cx="200" cy="100" r="180" fill="#38bdf8" opacity="0.15" filter="blur(40px)" />
  <circle class="bg-glow" cx="1000" cy="220" r="220" fill="#c084fc" opacity="0.15" filter="blur(50px)" />

  <!-- Background Technical Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
  </g>

  <!-- Dynamic Simulated Model Monitoring Wave Graph (Lower Third Background) -->
  <g class="wave-line" opacity="0.4">
    <path d="M -50 260 Q 150 210, 350 250 T 750 230 T 1150 270 T 1300 240" fill="none" stroke="url(#lineGrad)" stroke-width="3" />
    <path d="M -50 280 Q 200 240, 450 270 T 850 250 T 1250 280" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5" />
    
    <!-- Animated Data Points / Telemetry Nodes -->
    <circle class="pulse-node" cx="350" cy="250" fill="#38bdf8" />
    <circle class="pulse-node" cx="750" cy="230" fill="#818cf8" />
    <circle class="pulse-node" cx="1150" cy="270" fill="#c084fc" />
  </g>

  <!-- High-Contrast Foreground Content (Title & Subtitle) -->
  <g text-anchor="middle">
    <!-- Icon / Tag Pill -->
    <rect x="440" y="38" width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <text x="600" y="59" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">
      📊 ML OBSERVABILITY &amp; DRIFT
    </text>

    <!-- Main Title -->
    <text x="600" y="130" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Model Monitoring Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="172" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
      Curated List of SaaS Platforms &amp; Open-Source Projects for Production AI Reliability
    </text>

    <!-- Feature Badges Pill Row -->
    <text x="600" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Data Drift Detection • Concept Drift • LLM Tracing &amp; Evals • Explainable AI (XAI)
    </text>
  </g>
</svg>
